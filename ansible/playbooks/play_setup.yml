- name: Setup nginx
  hosts: mousehost
  become: true

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg2
          - ca-certificates
          - lsb-release
          - ubuntu-keyring
        state: present
        update_cache: true

    - name: Download nginx signing key
      ansible.builtin.get_url:
        url: https://nginx.org/keys/nginx_signing.key
        dest: /usr/share/keyrings/nginx_signing.key
        mode: '0644'

    - name: Add nginx repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/nginx_signing.key]
          https://nginx.org/packages/mainline/ubuntu
          {{ ansible_distribution_release }} nginx
        filename: nginx
        state: present
        update_cache: true

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx=1.29.6-1~noble
        state: present

