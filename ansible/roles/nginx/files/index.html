<!DOCTYPE html>
<html>
<head>
    <title>Hello DevOps world!</title>
</head>
<body>
    <h1>Hello DevOps world!</h1>
    <p>Timestamp: <span id="timestamp"></span></p>
</body>
<script>
    var timestamp = new Date().getTime();
    document.getElementById("timestamp").textContent = timestamp;
</script>
</html>
