events {

}

http {
    server {
        listen 80;
        server_name mousearthouse.space;

        root /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 443 ssl;
        server_name mousearthouse.space;

        root /var/www/html;
        index index.html;

        ssl_certificate /etc/letsencrypt/live/mousearthouse.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mousearthouse.space/privkey.pem;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
